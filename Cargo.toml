[package]
name = "beamhost"
version = "0.1.2"
edition = "2024"
description = "Self-hosted BeamMP server hosting with a live TUI and a daemon that keeps servers up after you close it"
license = "MIT"
readme = "README.md"
keywords = ["beammp", "beamng", "server", "hosting", "tui"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "beamhost"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
libc = "0.2.189"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process", "fs"] }
toml = "1.1.4"
ureq = "3.4.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
